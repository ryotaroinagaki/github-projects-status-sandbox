name: Project Status Sandbox

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - review_requested
      - closed
  pull_request_review:
    types:
      - submitted

env:
  PROJECT_ID: "PVT_kwHOB3a84M4BRnQE"
  FINAL_REVIEWER_LOGIN: Ryotaro-Inagaki
  STATUS_FIELD_NAME: Status
  STATUS_IN_PROGRESS: 作業中
  STATUS_FIRST_REVIEW: 1次レビュー中
  STATUS_FINAL_REVIEW: 最終レビュー中
  STATUS_FINAL_REVIEW_FIX: 最終レビュー対応中
  STATUS_AWAITING_MERGE: マージ待ち
  STATUS_DONE: 完了

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Assign pull request author
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const owner = payload.repository?.owner?.login;
            const repo = payload.repository?.name;
            const issueNumber = payload.pull_request?.number;
            const authorLogin = payload.pull_request?.user?.login;
            const assignees = (payload.pull_request?.assignees ?? [])
              .map((assignee) => assignee?.login)
              .filter(Boolean);

            if (!owner || !repo || !issueNumber || !authorLogin) {
              core.setFailed("Missing repository or pull request data required to assign the author.");
              return;
            }

            if (assignees.includes(authorLogin)) {
              core.info(`Pull request author ${authorLogin} is already assigned.`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: issueNumber,
              assignees: [authorLogin],
            });

            core.info(`Assigned pull request author ${authorLogin} to PR #${issueNumber}.`);

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Update project status
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const config = {
              projectId: process.env.PROJECT_ID,
              finalReviewerLogin: process.env.FINAL_REVIEWER_LOGIN,
              statusFieldName: process.env.STATUS_FIELD_NAME || "Status",
              statusNames: {
                inProgress: process.env.STATUS_IN_PROGRESS,
                firstReview: process.env.STATUS_FIRST_REVIEW,
                finalReview: process.env.STATUS_FINAL_REVIEW,
                finalReviewFix: process.env.STATUS_FINAL_REVIEW_FIX,
                awaitingMerge: process.env.STATUS_AWAITING_MERGE,
                done: process.env.STATUS_DONE,
              },
            };

            function requireConfig(value, key) {
              if (!value) {
                throw new Error(`Missing workflow env: ${key}`);
              }
              return value;
            }

            requireConfig(config.finalReviewerLogin, "FINAL_REVIEWER_LOGIN");
            requireConfig(config.projectId, "PROJECT_ID");
            requireConfig(config.statusNames.inProgress, "STATUS_IN_PROGRESS");
            requireConfig(config.statusNames.firstReview, "STATUS_FIRST_REVIEW");
            requireConfig(config.statusNames.finalReview, "STATUS_FINAL_REVIEW");
            requireConfig(config.statusNames.finalReviewFix, "STATUS_FINAL_REVIEW_FIX");
            requireConfig(config.statusNames.awaitingMerge, "STATUS_AWAITING_MERGE");
            requireConfig(config.statusNames.done, "STATUS_DONE");

            function isSameRepositoryPullRequest(payload) {
              const headRepository = payload.pull_request?.head?.repo?.full_name;
              const baseRepository = payload.pull_request?.base?.repo?.full_name;

              return Boolean(headRepository && baseRepository && headRepository === baseRepository);
            }

            function resolveTargetStatus(payload) {
              if (context.eventName === "pull_request") {
                if (
                  payload.action === "opened" ||
                  payload.action === "reopened" ||
                  payload.action === "ready_for_review"
                ) {
                  return config.statusNames.inProgress;
                }

                if (payload.action === "review_requested") {
                  const requestedReviewer = payload.requested_reviewer?.login;
                  const requestedReviewers = (payload.pull_request?.requested_reviewers ?? [])
                    .map((reviewer) => reviewer?.login)
                    .filter(Boolean);

                  if (
                    requestedReviewer === config.finalReviewerLogin ||
                    requestedReviewers.includes(config.finalReviewerLogin)
                  ) {
                    return config.statusNames.finalReview;
                  }

                  if (requestedReviewer) {
                    return config.statusNames.firstReview;
                  }

                  core.info("Ignoring review_requested event without a user reviewer.");
                  return null;
                }

                if (payload.action === "closed" && payload.pull_request?.merged) {
                  return config.statusNames.done;
                }

                return null;
              }

              if (context.eventName === "pull_request_review") {
                const review = payload.review;
                if (review?.user?.login !== config.finalReviewerLogin) {
                  return null;
                }

                if (review.state === "changes_requested") {
                  return config.statusNames.finalReviewFix;
                }

                if (review.state === "approved") {
                  return config.statusNames.awaitingMerge;
                }
              }

              return null;
            }

            async function fetchStatusField(projectId) {
              const query = `
                query($projectId: ID!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, { projectId });
              const fields = result?.node?.fields?.nodes ?? [];

              return fields.find(
                (field) =>
                  field?.__typename === "ProjectV2SingleSelectField" &&
                  field.name === config.statusFieldName
              );
            }

            async function findProjectItemId(pullRequestNodeId) {
              const query = `
                query($projectId: ID!, $after: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $after) {
                        nodes {
                          id
                          content {
                            __typename
                            ... on PullRequest {
                              id
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }
                }
              `;

              let after = null;

              while (true) {
                const result = await github.graphql(query, {
                  projectId: config.projectId,
                  after,
                });
                const items = result?.node?.items?.nodes ?? [];
                const match = items.find(
                  (item) => item?.content?.__typename === "PullRequest" && item.content.id === pullRequestNodeId
                );

                if (match) {
                  return match.id;
                }

                const pageInfo = result?.node?.items?.pageInfo;
                if (!pageInfo?.hasNextPage) {
                  return null;
                }

                after = pageInfo.endCursor;
              }
            }

            async function updateProjectStatus(projectId, itemId, targetStatus) {
              const field = await fetchStatusField(projectId);
              if (!field) {
                core.setFailed(`Status field not found: ${config.statusFieldName}`);
                return;
              }

              const option = (field.options ?? []).find(
                (entry) => entry?.name === targetStatus
              );
              if (!option) {
                core.setFailed(`Status option not found: ${targetStatus}`);
                return;
              }

              const mutation = `
                mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                  updateProjectV2ItemFieldValue(input: $input) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              await github.graphql(mutation, {
                input: {
                  projectId,
                  itemId,
                  fieldId: field.id,
                  value: {
                    singleSelectOptionId: option.id,
                  },
                },
              });
            }

            const payload = context.payload;
            if (!isSameRepositoryPullRequest(payload)) {
              core.info("Skipping project status update for a pull request from a different repository.");
              return;
            }

            const targetStatus = resolveTargetStatus(payload);

            if (!targetStatus) {
              core.info("No status update is required for this event.");
              return;
            }

            const pullRequestNodeId = payload.pull_request?.node_id;
            if (!pullRequestNodeId) {
              core.setFailed("Missing pull_request.node_id in the event payload.");
              return;
            }

            const itemId = await findProjectItemId(pullRequestNodeId);
            if (!itemId) {
              core.info("The pull request is not in the target project. Skipping.");
              return;
            }

            await updateProjectStatus(config.projectId, itemId, targetStatus);
            core.info(`Updated project item ${itemId} to ${targetStatus}`);
